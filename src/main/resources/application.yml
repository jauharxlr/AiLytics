spring:
  application:
    name: ailytics
  ai:
    google:
      gemini:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ailytics}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

playwright:
  headless: true

processing:
  max-concurrent-jobs: 5
  upload-dir: uploads

storage:
  mode: local

auth:
  master:
    username: ${MASTER_USERNAME:admin}
    password: ${MASTER_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours

webhooks:
  urls: ${WEBHOOK_URLS:}
  min-confidence: 0.85
