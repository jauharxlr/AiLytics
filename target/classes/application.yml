server:
  port: 8081

spring:
  application:
    name: ailytics
  ai:
    vertex:
      ai:
        gemini:
          project-id: dummy-project
          location: us-central1
          chat:
            options:
              model: gemini-2.0-flash
  datasource:
    url: jdbc:h2:mem:ailytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

playwright:
  headless: true

processing:
  max-concurrent-jobs: 5
  upload-dir: uploads

storage:
  mode: local

auth:
  master:
    username: ${MASTER_USERNAME:admin}
    password: ${MASTER_PASSWORD:admin123}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours

webhooks:
  urls: ${WEBHOOK_URLS:}
  min-confidence: 0.85
